            pCtx.beginPath(); pCtx.rect(aX, aY, sAW, sAH); pCtx.clip();
            pCtx.drawImage(upImg, ix, iy, sW * sf, sH * sf);
            pCtx.restore();
        }

        if (hasMount && !mountOutside) {
            const mc = mountColour === 'white' ? '#f5f5f5' : mountColour === 'black' ? '#111' : mountColour;
            pCtx.fillStyle = mc;
            const mW = outerW - (hasFrame ? sFrame * 2 : 0);
            const mH = outerH - (hasFrame ? sFrame * 2 : 0);
            pCtx.fillRect(mountX, mountY, mW, sMount);
            pCtx.fillRect(mountX, mountY + mH - sMount, mW, sMount);
            pCtx.fillRect(mountX, mountY, sMount, mH);
            pCtx.fillRect(mountX + mW - sMount, mountY, sMount, mH);
            const bSize = Math.min(6 * sf, sMount);
            pCtx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            pCtx.beginPath(); pCtx.moveTo(innerX, innerY); pCtx.lineTo(innerX + sVisW, innerY); pCtx.lineTo(innerX + sVisW + bSize, innerY - bSize); pCtx.lineTo(innerX - bSize, innerY - bSize); pCtx.fill();
            pCtx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            pCtx.beginPath(); pCtx.moveTo(innerX, innerY + sVisH); pCtx.lineTo(innerX + sVisW, innerY + sVisH); pCtx.lineTo(innerX + sVisW + bSize, innerY + sVisH + bSize); pCtx.lineTo(innerX - bSize, innerY + sVisH + bSize); pCtx.fill();
            pCtx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            pCtx.beginPath(); pCtx.moveTo(innerX, innerY); pCtx.lineTo(innerX, innerY + sVisH); pCtx.lineTo(innerX - bSize, innerY + sVisH + bSize); pCtx.lineTo(innerX - bSize, innerY - bSize); pCtx.fill();
            pCtx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            pCtx.beginPath(); pCtx.moveTo(innerX + sVisW, innerY); pCtx.lineTo(innerX + sVisW, innerY + sVisH); pCtx.lineTo(innerX + sVisW + bSize, innerY + sVisH + bSize); pCtx.lineTo(innerX + sVisW + bSize, innerY - bSize); pCtx.fill();
            pCtx.strokeStyle = 'rgba(0, 0, 0, 0.3)'; pCtx.lineWidth = 1; pCtx.strokeRect(innerX, innerY, sVisW, sVisH);
            pCtx.strokeStyle = 'rgba(0, 0, 0, 0.1)'; pCtx.strokeRect(innerX - bSize, innerY - bSize, sVisW + bSize * 2, sVisH + bSize * 2);
        }

        if (hasFrame) {
            const fX = mountOutside ? outerX + sMountExtX : outerX;
            const fY = mountOutside ? outerY + sMountExtY : outerY;
            const fW = outerW - (mountOutside ? sMountExtX * 2 : 0);
            const fH = outerH - (mountOutside ? sMountExtY * 2 : 0);
            const solidColour = SOLID_FRAMES[selectedFrame];
            if (solidColour) {
                const x = fX, y = fY, w = fW, h = fH, ft = sFrame;
                pCtx.fillStyle = solidColour;
                pCtx.beginPath(); pCtx.moveTo(x, y); pCtx.lineTo(x + w, y); pCtx.lineTo(x + w - ft, y + ft); pCtx.lineTo(x + ft, y + ft); pCtx.closePath(); pCtx.fill();
                pCtx.beginPath(); pCtx.moveTo(x, y + h); pCtx.lineTo(x + w, y + h); pCtx.lineTo(x + w - ft, y + h - ft); pCtx.lineTo(x + ft, y + h - ft); pCtx.closePath(); pCtx.fill();
                pCtx.beginPath(); pCtx.moveTo(x, y); pCtx.lineTo(x + ft, y + ft); pCtx.lineTo(x + ft, y + h - ft); pCtx.lineTo(x, y + h); pCtx.closePath(); pCtx.fill();
                pCtx.beginPath(); pCtx.moveTo(x + w, y); pCtx.lineTo(x + w - ft, y + ft); pCtx.lineTo(x + w - ft, y + h - ft); pCtx.lineTo(x + w, y + h); pCtx.closePath(); pCtx.fill();
                pCtx.strokeStyle = '#888888'; pCtx.lineWidth = 1;
                pCtx.beginPath();
                pCtx.moveTo(x, y); pCtx.lineTo(x + ft, y + ft);
                pCtx.moveTo(x + w, y); pCtx.lineTo(x + w - ft, y + ft);
                pCtx.moveTo(x, y + h); pCtx.lineTo(x + ft, y + h - ft);
                pCtx.moveTo(x + w, y + h); pCtx.lineTo(x + w - ft, y + h - ft);
                pCtx.stroke();
                pCtx.strokeRect(x, y, w, h);
                pCtx.strokeRect(x + ft, y + ft, w - ft * 2, h - ft * 2);
                pCtx.lineWidth = 1.5;
            } else {
                try {
                    let frameImg = frameImageCache[selectedFrame];
                    if (!frameImg) {
                        try { frameImg = await loadFrameImage(selectedFrame); } catch (e) { frameImg = null; }
                    }
                    if (frameImg) {
                        drawFrameAroundRect(pCtx, frameImg, frameWidthMm, sf, fX, fY, fW, fH, selectedFrame);
                    } else {
                        pCtx.fillStyle = '#aaa';
                        pCtx.fillRect(fX, fY, fW, sFrame);
                        pCtx.fillRect(fX, fY + fH - sFrame, fW, sFrame);
                        pCtx.fillRect(fX, fY, sFrame, fH);
                        pCtx.fillRect(fX + fW - sFrame, fY, sFrame, fH);
                    }
                } catch(e) {}
            }
        }

        if (hasMount && mountOutside) {
            const mc = mountColour === 'white' ? '#f5f5f5' : mountColour === 'black' ? '#111' : mountColour;
            pCtx.fillStyle = mc;
            pCtx.fillRect(outerX, outerY, outerW, sMountExtY);
            pCtx.fillRect(outerX, outerBottom - sMountExtY, outerW, sMountExtY);
            pCtx.fillRect(outerX, outerY, sMountExtX, outerH);
            pCtx.fillRect(outerRight - sMountExtX, outerY, sMountExtX, outerH);
        }

        const frameDisplayName = selectedFrame === 'BLACK' ? 'BLACK FRAME' : selectedFrame === 'WHITE' ? 'WHITE FRAME' : selectedFrame === 'MDF' ? 'MDF FRAME' : selectedFrame;
        const headingText = fn ? `${fn} - ARTWORK PROOF` : `ARTWORK PROOF`;
        pCtx.fillStyle = '#111';
        pCtx.font = 'bold 22px Arial'; pCtx.textAlign = 'center';
        const topLineY = outerY - guideGap - tickLen;
        const mainCentreX = frameProofImg ? (outerX + outerW + panelGap + framePanelW) / 2 : outerX + outerW / 2;
        pCtx.fillText(headingText, mainCentreX, (topLineY - 20) / 2 + 14);

        if (frameProofImg) {
            const imgAspect = frameProofImg.width / frameProofImg.height;
            let imgDrawW = Math.min(500, framePanelW - 20);
            let imgDrawH = imgDrawW / imgAspect;
            if (imgDrawH > 500) { imgDrawH = 500; imgDrawW = imgDrawH * imgAspect; }
            const totalBlockH = 28 + 12 + imgDrawH;
            const blockTop = (proofH - totalBlockH) / 2;
            const labelY = blockTop + 20;
            const imgDrawX = panelX + (framePanelW - imgDrawW) / 2;
            const imgDrawY = labelY + 12;
            pCtx.drawImage(frameProofImg, imgDrawX, imgDrawY, imgDrawW, imgDrawH);
            pCtx.font = 'bold 22px Arial'; pCtx.textAlign = 'center'; pCtx.fillStyle = '#111';
            pCtx.fillText(`FRAME STYLE - ${frameDisplayName}`, imgDrawX + imgDrawW / 2, labelY);
        }

        pCtx.strokeStyle = '#444'; pCtx.lineWidth = 1.5; pCtx.fillStyle = '#444';

        function htick(x, y) { pCtx.beginPath(); pCtx.moveTo(x - tickLen, y); pCtx.lineTo(x + tickLen, y); pCtx.stroke(); }
        function vtick(x, y) { pCtx.beginPath(); pCtx.moveTo(x, y - tickLen); pCtx.lineTo(x, y + tickLen); pCtx.stroke(); }

        function vSolidLabel(lineX, y1, y2, label) {
            pCtx.beginPath(); pCtx.moveTo(lineX - tickLen, y1); pCtx.lineTo(lineX + tickLen, y1); pCtx.stroke();
            pCtx.beginPath(); pCtx.moveTo(lineX - tickLen, y2); pCtx.lineTo(lineX + tickLen, y2); pCtx.stroke();
            pCtx.beginPath(); pCtx.moveTo(lineX, y1); pCtx.lineTo(lineX, y2); pCtx.stroke();
            const mid = (y1 + y2) / 2;
            pCtx.font = `${fontSize}px Arial`; pCtx.fillStyle = '#444'; pCtx.textAlign = 'center';
            pCtx.save();
            pCtx.translate(lineX - guideGap, mid);
            pCtx.rotate(-Math.PI / 2);
            pCtx.fillText(label, 0, 5);
            pCtx.restore();
        }

        const leftLineX = outerX - guideGap - tickLen;

        if (hasFrame && !mountOutside) { vSolidLabel(leftLineX, outerY, outerY + sFrame, `${frameWidthMm.toFixed(1)}mm`); }
        if (hasFrame && mountOutside)  { vSolidLabel(leftLineX, outerBottom - sMountExtY - sFrame, outerBottom - sMountExtY, `${frameWidthMm.toFixed(1)}mm`); }

        vSolidLabel(leftLineX, innerY, innerY + sVisH, `${(visH_mm - excessUpMm).toFixed(1)}mm`);

        if (hasMount && !mountOutside) {
            const mH = outerH - (hasFrame ? sFrame * 2 : 0);
            vSolidLabel(leftLineX, mountY + mH - sMount, mountY + mH, `${mountSize.toFixed(1)}mm`);
        }
        if (hasMount && mountOutside) { vSolidLabel(leftLineX, outerY, outerY + sMountExtY, `${mountSize.toFixed(1)}mm`); }

        const rightLineX = outerRight + guideGap + tickLen;
        if (hasFrame || hasMount) {
            htick(rightLineX, outerY); htick(rightLineX, outerBottom);
            pCtx.beginPath(); pCtx.moveTo(rightLineX, outerY); pCtx.lineTo(rightLineX, outerBottom); pCtx.stroke();
            const rightMid = (outerY + outerBottom) / 2;
            pCtx.font = `${fontSize}px Arial`; pCtx.fillStyle = '#444';
            pCtx.save();
            pCtx.translate(rightLineX + guideGap, rightMid);
            pCtx.rotate(-Math.PI / 2);
            pCtx.textAlign = 'center';
            pCtx.fillText(`${(totalHeightMm - excessUpMm).toFixed(1)}mm`, 0, 5);
            pCtx.restore();
        }

        vtick(innerX, topLineY); vtick(innerX + sVisW, topLineY);
        pCtx.beginPath(); pCtx.moveTo(innerX, topLineY); pCtx.lineTo(innerX + sVisW, topLineY); pCtx.stroke();
        pCtx.font = `${fontSize}px Arial`; pCtx.fillStyle = '#444'; pCtx.textAlign = 'center';
        pCtx.fillText(`${visW_mm.toFixed(1)}mm`, innerX + sVisW / 2, topLineY - 6);

        const botLineY = outerBottom + guideGap + tickLen;
        if (hasFrame || hasMount) {
            vtick(outerX, botLineY); vtick(outerRight, botLineY);
            pCtx.beginPath(); pCtx.moveTo(outerX, botLineY); pCtx.lineTo(outerRight, botLineY); pCtx.stroke();
            pCtx.font = `${fontSize}px Arial`; pCtx.fillStyle = '#444'; pCtx.textAlign = 'center';
            pCtx.fillText(`${totalWidthMm.toFixed(1)}mm`, (outerX + outerRight) / 2, botLineY + guideGap + 5);
        }

        // ── Disclaimer text, now with optional viewing distance line ────────────
        const dpiInfo = calcDpiInfo();
        let sharpnessText = '';
        if (dpiInfo.minDpi !== null) {
            const totalInches = 3438 / dpiInfo.minDpi;
            const feet = Math.floor(totalInches / 12);
            const inches = totalInches % 12;
            const inchFraction = inches >= 0.67 ? ` ${Math.round(inches)}"` : (inches >= 0.33 ? ` ${Math.floor(inches)} ${Math.round((inches % 1) * 2)}/2"` : '');
            const ftInches = feet > 0 ? `${feet}'${inchFraction}` : `${Math.round(inches)}"`;
            sharpnessText = ` It will be sharp to the human eye from ${dpiInfo.distanceM}m (${ftInches}).`;
        }

        let disclaimerLine1, disclaimerLine2;
        if (hasFrame && hasMount) {
            disclaimerLine1 = `This proof shows how your artwork will be cropped to fit the mechanism dimensions.${sharpnessText}`;
            disclaimerLine2 = 'It is shown with a representative frame and mount. Please review carefully and confirm approval for your order to progress to production.';
        } else if (hasFrame) {
            disclaimerLine1 = `This proof shows how your artwork will be cropped to fit the mechanism dimensions.${sharpnessText}`;
            disclaimerLine2 = 'It is shown with a representative frame. Please review carefully and confirm approval for your order to progress to production.';
        } else if (hasMount) {
            disclaimerLine1 = `This proof shows how your artwork will be cropped to fit the mechanism dimensions.${sharpnessText}`;
            disclaimerLine2 = 'It is shown with a mount. Please review carefully and confirm approval for your order to progress to production.';
        } else {
            disclaimerLine1 = `This proof shows how your artwork will be cropped to fit the mechanism dimensions.${sharpnessText}`;
            disclaimerLine2 = 'It is important to review the positioning and cropping to ensure it suits your requirements. Please confirm approval for your order to progress to production.';
        }

        const disclaimerAreaTop = (hasFrame || hasMount) ? botLineY + guideGap + 5 + fontSize + 10 : outerBottom;
        const disclaimerAreaBot = pc.height - (hasFrame || hasMount ? 10 : 10);
        const disclaimerMidY = (disclaimerAreaTop + disclaimerAreaBot) / 2 + (hasFrame || hasMount ? 0 : 12);
        pCtx.font = '12px Arial'; pCtx.textAlign = 'center'; pCtx.fillStyle = '#777';
        pCtx.fillText(disclaimerLine1, mainCentreX, disclaimerMidY - 8);
        pCtx.fillText(disclaimerLine2, mainCentreX, disclaimerMidY + 8);

        const fileNameBase = hasFrame
            ? (fn ? `${fn} - ARTWORK PROOF - ${frameDisplayName}` : `ARTWORK PROOF - ${frameDisplayName}`)
            : (fn ? `${fn} - ARTWORK PROOF` : 'ARTWORK PROOF');
        const link = document.createElement('a');
        link.href = pc.toDataURL('image/jpeg', 0.9);
        link.download = `${fileNameBase}.jpg`;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    function genPDF() {
        const cW = getNum('cW'), cH = getNum('cH');
        const fH1 = getNum('fH1'), fH2 = getNum('fH2'), fH3 = getNum('fH3');
        fn = document.getElementById('fn').value || 'default_filename';
        const aFH2 = fH1 + fH2, aH = fH1 + fH2 + fH3;
        const cWpt = cW * 72 / 25.4, cHpt = cH * 72 / 25.4;
        const pdf = new jsPDF({ orientation: cW > cH ? 'landscape' : 'portrait', unit: 'pt', format: [cWpt, cHpt] });

        if (activeTemplate !== 'RA7B' && upImg) {
            const aW = cW - SIDE_MARGIN_MM * 2;
            const scl = getImgScale(upImg, aW, fH3);
            const sW = upImg.width * scl, sH = upImg.height * scl;
            const imgX = (SIDE_MARGIN_MM + (aW - sW) / 2 + imgXOffset) * 72 / 25.4;
            const imgY = (aFH2 + imgYOffset) * 72 / 25.4;
            const tc = document.createElement('canvas');
            tc.width = upImg.width; tc.height = upImg.height;
            tc.getContext('2d').drawImage(upImg, 0, 0);
            pdf.addImage(tc.toDataURL('image/jpeg', 1.0), 'JPEG', imgX, imgY, sW * 72 / 25.4, sH * 72 / 25.4);
        }

        pdf.setFillColor(255, 255, 255);
        pdf.rect(0, 0, cWpt, aFH2 * 72 / 25.4, 'F');
        pdf.rect(0, aH * 72 / 25.4, cWpt, (cH - aH) * 72 / 25.4, 'F');
        pdf.rect(0, aFH2 * 72 / 25.4, SIDE_MARGIN_MM * 72 / 25.4, fH3 * 72 / 25.4, 'F');
        pdf.rect((cW - SIDE_MARGIN_MM) * 72 / 25.4, aFH2 * 72 / 25.4, SIDE_MARGIN_MM * 72 / 25.4, fH3 * 72 / 25.4, 'F');
        pdf.setLineWidth(0.1 * 72 / 25.4);
        pdf.rect(0, 0, cWpt, cHpt);
        pdf.line(SIDE_MARGIN_MM * 72 / 25.4, 0, SIDE_MARGIN_MM * 72 / 25.4, cHpt);
        pdf.line((cW - SIDE_MARGIN_MM) * 72 / 25.4, 0, (cW - SIDE_MARGIN_MM) * 72 / 25.4, cHpt);
        pdf.line(0, fH1 * 72 / 25.4, cWpt, fH1 * 72 / 25.4);
        pdf.line(0, aFH2 * 72 / 25.4, cWpt, aFH2 * 72 / 25.4);
        pdf.line(0, aH * 72 / 25.4, cWpt, aH * 72 / 25.4);
        if (drawExtraLine) { pdf.setLineWidth(1); pdf.line(0, (cH - 12) * 72 / 25.4, cWpt, (cH - 12) * 72 / 25.4); }
        pdf.setFont('Helvetica', 2 * 72 / 25.4);
        pdf.text('WELD ZIP PROFILE HERE', cW / 2 * 72 / 25.4, 9 * 72 / 25.4, { align: 'center' });
        pdf.text('APPLY TUBE TO THIS FACE', cW / 2 * 72 / 25.4, (cH - 6) * 72 / 25.4, { align: 'center' });
        pdf.text(fn, 15 * 72 / 25.4, (fH1 + 15) * 72 / 25.4);
        const aW = cW - SIDE_MARGIN_MM * 2;
        let imgMeas = '';
        if (upImg) {
            const scl = getImgScale(upImg, aW, fH3);
            const sW = upImg.width * scl, sH = upImg.height * scl;
            const normalLimitY = sH - fH3;
            const excessUp = imgYOffset < -normalLimitY ? Math.abs(imgYOffset) - normalLimitY : 0;
            const visW = Math.min(sW, aW).toFixed(1);
            const visH = (Math.min(sH, fH3) - excessUp).toFixed(1);
            imgMeas = ` | IMAGE WIDTH: ${visW}mm | IMAGE HEIGHT: ${visH}mm`;
        }
        const meas = `ZIP WELD AREA: ${fH1}mm | GAP BELOW ZIP: ${fH2}mm | ARTWORK HEIGHT: ${fH3}mm${imgMeas} | PDF WIDTH: ${cW}mm | PDF HEIGHT: ${cH}mm`;
        pdf.text(meas, cWpt - 15 * 72 / 25.4, (fH1 + 15) * 72 / 25.4, { align: 'right' });
        pdf.save(`${fn}.pdf`);
    }

    function handleImgUp(event) {
        const loader = document.getElementById('loader');
        loader.style.display = 'block';
        const rdr = new FileReader();
        rdr.onload = e => {
            upImg = new Image();
            upImg.onload = () => {
                imgXOffset = 0; imgYOffset = 0; imgZoomOffset = 0; loader.style.display = 'none';
                updateDpiNote();
                drawCnv(); updateFramePreview();
            };
            upImg.src = e.target.result;
        };
        rdr.readAsDataURL(event.target.files[0]);
    }

    function rmvImg() {
        upImg = null; imgXOffset = 0; imgYOffset = 0; imgZoomOffset = 0;
        document.getElementById('loader').style.display = 'none';
        document.getElementById('urlStatus').style.display = 'none';
        updateDpiNote();
        drawCnv(); updateFramePreview();
    }

    function shiftImage(direction, vertical = false) {
        if (!upImg) return;
        const cW = getNum('cW'), fH3 = getNum('fH3');
        const aW = cW - SIDE_MARGIN_MM * 2;
        const scl = getImgScale(upImg, aW, fH3);
        const sW = upImg.width * scl, sH = upImg.height * scl;
        const amt = 3 * 72 / 25.4;
        if (vertical) {
            if (sH >= fH3) {
                const limitY = sH - fH3 + 10;
                if (direction === 'up') imgYOffset = Math.max(-limitY, imgYOffset - amt);
                else if (direction === 'down') imgYOffset = Math.min(0, imgYOffset + amt);
            }
        } else {
            if (sW >= aW) {
                const limitX = (sW - aW) / 2;
                if (direction === 'left') imgXOffset = Math.max(-limitX, imgXOffset - amt);
                else if (direction === 'right') imgXOffset = Math.min(limitX, imgXOffset + amt);
            }
        }
        drawCnv(); updateFramePreview();
    }

    function updateArrows(cW) {
        const ids = ['leftArrow', 'rightArrow', 'upArrow', 'downArrow'];
        if (!upImg) { ids.forEach(id => document.getElementById(id).disabled = true); return; }
        const fH3 = getNum('fH3');
        const aW = cW - SIDE_MARGIN_MM * 2;
        const scl = getImgScale(upImg, aW, fH3);
        const sW = upImg.width * scl, sH = upImg.height * scl;
        const limitX = sW >= aW ? (sW - aW) / 2 : 0;
        const limitY = sH >= fH3 ? sH - fH3 + 10 : 0;
        document.getElementById('leftArrow').disabled  = sW < aW || imgXOffset <= -limitX;
        document.getElementById('rightArrow').disabled = sW < aW || imgXOffset >= limitX;
        document.getElementById('upArrow').disabled    = sH < fH3 || imgYOffset <= -limitY;
        document.getElementById('downArrow').disabled  = sH < fH3 || imgYOffset >= 0;
    }

    function startMoving(dir, vert) { if (!intervalId) intervalId = setInterval(() => shiftImage(dir, vert), 100); }
    function stopMoving() { clearInterval(intervalId); intervalId = null; }

    function startDrag(e) {
        if (!upImg) return;
        const rect = cnv.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        const cW = getNum('cW'), fH1 = getNum('fH1'), fH2 = getNum('fH2'), fH3 = getNum('fH3');
        const pxPerMm = rect.width / cW;
        const artworkTopMm = fH1 + fH2;
        const pointerXmm = (cx - rect.left) / pxPerMm;
        const pointerYmm = (cy - rect.top) / pxPerMm;
        if (pointerXmm < SIDE_MARGIN_MM || pointerXmm > cW - SIDE_MARGIN_MM || pointerYmm < artworkTopMm || pointerYmm > artworkTopMm + fH3) return;
        isDragging = true;
        dragStartX = pointerXmm - imgXOffset;
        dragStartY = pointerYmm - artworkTopMm - imgYOffset;
    }

    function clampOffsetX(value, imgSize, containerSize) {
        if (imgSize >= containerSize) { const limit = (imgSize - containerSize) / 2; return Math.max(-limit, Math.min(limit, value)); }
        return 0;
    }

    function clampOffsetY(value, imgSize, containerSize, extraHeadroom = 0) {
        if (imgSize >= containerSize) { return Math.max(-(imgSize - containerSize) - extraHeadroom, Math.min(0, value)); }
        return 0;
    }

    function doDrag(e) {
        if (!isDragging || !upImg) return;
        const rect = cnv.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        const cW = getNum('cW'), fH1 = getNum('fH1'), fH2 = getNum('fH2'), fH3 = getNum('fH3');
        const pxPerMm = rect.width / cW;
        const artworkTopMm = fH1 + fH2;
        const aW = cW - SIDE_MARGIN_MM * 2;
        const scl = getImgScale(upImg, aW, fH3);
        const sW = upImg.width * scl, sH = upImg.height * scl;
        imgXOffset = clampOffsetX((cx - rect.left) / pxPerMm - dragStartX, sW, aW);
        imgYOffset = clampOffsetY((cy - rect.top) / pxPerMm - artworkTopMm - dragStartY, sH, fH3, sH > fH3 ? 10 : 0);
        scheduleDraw(); updateFramePreview();
    }

    function endDrag() { isDragging = false; }

    cnv.addEventListener('mousedown', startDrag);
    cnv.addEventListener('mousemove', doDrag);
    cnv.addEventListener('mouseup', endDrag);
    cnv.addEventListener('mouseleave', endDrag);
    cnv.addEventListener('touchstart', e => { e.preventDefault(); startDrag(e); }, { passive: false });
    cnv.addEventListener('touchmove', e => { e.preventDefault(); doDrag(e); }, { passive: false });
    cnv.addEventListener('touchend', endDrag);
    cnv.addEventListener('touchcancel', endDrag);

    document.getElementById('leftArrow').addEventListener('click', () => shiftImage('left'));
    document.getElementById('rightArrow').addEventListener('click', () => shiftImage('right'));
    document.getElementById('upArrow').addEventListener('click', () => shiftImage('up', true));
    document.getElementById('downArrow').addEventListener('click', () => shiftImage('down', true));

    document.getElementById('zoomOutBtn').addEventListener('click', () => {
        imgZoomOffset -= 2.5;
        const cW = getNum('cW'), fH3 = getNum('fH3');
        const aW = cW - SIDE_MARGIN_MM * 2;
        if (upImg) { const scl = getImgScale(upImg, aW, fH3); const sW = upImg.width * scl, sH = upImg.height * scl; imgXOffset = clampOffsetX(imgXOffset, sW, aW); imgYOffset = clampOffsetY(imgYOffset, sH, fH3, 10); }
        drawCnv(); updateFramePreview(); updateDpiNote();
    });
    document.getElementById('zoomInBtn').addEventListener('click', () => {
        imgZoomOffset += 2.5;
        const cW = getNum('cW'), fH3 = getNum('fH3');
        const aW = cW - SIDE_MARGIN_MM * 2;
        if (upImg) { const scl = getImgScale(upImg, aW, fH3); const sW = upImg.width * scl, sH = upImg.height * scl; imgXOffset = clampOffsetX(imgXOffset, sW, aW); imgYOffset = clampOffsetY(imgYOffset, sH, fH3); }
        drawCnv(); updateFramePreview(); updateDpiNote();
    });

    ['leftArrow', 'rightArrow', 'upArrow', 'downArrow'].forEach(id => {
        const btn = document.getElementById(id);
        const dir = id.replace('Arrow', '');
        const vert = id === 'upArrow' || id === 'downArrow';
        btn.addEventListener('mousedown', () => startMoving(dir, vert));
        btn.addEventListener('mouseup', stopMoving);
        btn.addEventListener('mouseleave', stopMoving);
    });

    document.getElementById('fn').addEventListener('input', function() { fn = this.value; drawCnv(); });
    ['cW', 'cH', 'fH1', 'fH2', 'fH3'].forEach(id => document.getElementById(id).addEventListener('input', () => { drawCnv(); updateFramePreview(); updateDpiNote(); }));
    document.getElementById('mountSize').addEventListener('input', updateFramePreview);
    document.getElementById('mountSize').addEventListener('change', updateFramePreview);
    document.getElementById('mountColour').addEventListener('change', updateFramePreview);
    document.getElementById('mountOutside').addEventListener('change', updateFramePreview);
    ['targetW', 'targetH'].forEach(id => document.getElementById(id).addEventListener('input', updateFramePreview));
    document.getElementById('frameThickness').addEventListener('input', updateFramePreview);
    document.getElementById('frameThickness').addEventListener('change', updateFramePreview);

    function updateFrameThicknessRow(key) {
        const row = document.getElementById('frameThicknessRow');
        row.style.display = (key === 'BLACK' || key === 'WHITE' || key === 'MDF') ? 'block' : 'none';
    }

    document.getElementById('frameSelect').addEventListener('change', async function() {
        const key = this.value;
        updateFrameThicknessRow(key);
        if (AUTO_MOUNT_SIZES[key] !== undefined) {
            document.getElementById('mountSize').value = AUTO_MOUNT_SIZES[key];
        } else if (key === 'none' || key === 'BLACK' || key === 'WHITE' || key === 'MDF') {
            document.getElementById('mountSize').value = 0;
        }
        if (key === 'none' || key === 'BLACK' || key === 'WHITE' || key === 'MDF') { setStatus(''); updateFramePreview(); return; }
        if (frameImageCache[key]) { setStatus('Frame ready.', '#2a7a2a'); updateFramePreview(); return; }
        try { await loadFrameImage(key); updateFramePreview(); } catch (e) { updateFramePreview(); }
    });

    async function updateFramePreview() {
        const fH3 = getNum('fH3');
        const section = document.getElementById('framePreviewSection');
        if (fH3 <= 0) { section.style.display = 'none'; return; }

        const selectedFrame = document.getElementById('frameSelect').value;
        const previewCnv = document.getElementById('framePreviewCnv');
        const hasFrame = selectedFrame !== 'none';
        const mountSizeMm = getNum('mountSize');
        const hasMount = mountSizeMm > 0;
        const mountOutside = document.getElementById('mountOutside').checked;

        section.style.display = 'block';

        const cW = getNum('cW');
        const artworkWidth = cW - SIDE_MARGIN_MM * 2;
        const artworkHeight = fH3;
        const frameWidthMm = hasFrame ? ((['BLACK','WHITE','MDF'].includes(selectedFrame)) ? getNum('frameThickness') : (FRAME_WIDTHS[selectedFrame] || 80)) : 0;

        let actualOverlapX, actualOverlapY, mountExtX, mountExtY, visW_mm, visH_mm;

        if (hasMount && mountOutside) {
            actualOverlapX = 0; actualOverlapY = 0;
            mountExtX = mountSizeMm; mountExtY = mountSizeMm;
            visW_mm = artworkWidth; visH_mm = artworkHeight;
        } else {
            let overlapX = hasMount ? 17 : 0;
            let overlapY = 0;
            if (hasMount) {
                if (activeTemplate === 'RA5') overlapY = 19.5;
                else if (activeTemplate === 'RA6') overlapY = 26.5;
                else if (activeTemplate === 'RA7' || activeTemplate === 'RA7B') overlapY = 20;
                else overlapY = 19.5;
            }
            const tW = getNum('targetW');
            const tH = getNum('targetH');
            const totalEdge = (hasFrame ? frameWidthMm : 0) + (hasMount ? mountSizeMm : 0);
            if (tW > 0 && (hasMount || hasFrame)) { const visW = tW - (totalEdge * 2); overlapX = (artworkWidth - visW) / 2; }
            if (tH > 0 && (hasMount || hasFrame)) { const visH = tH - (totalEdge * 2); overlapY = (artworkHeight - visH) / 2; }
            const clampedOverlapX = Math.min(overlapX, totalEdge);
            const clampedOverlapY = Math.min(overlapY, totalEdge);
            actualOverlapX = clampedOverlapX;
            actualOverlapY = clampedOverlapY;
            mountExtX = hasMount ? Math.max(0, mountSizeMm - Math.max(0, overlapX - (hasFrame ? frameWidthMm : 0))) : 0;
            mountExtY = hasMount ? Math.max(0, mountSizeMm - Math.max(0, overlapY - (hasFrame ? frameWidthMm : 0))) : 0;
            visW_mm = artworkWidth - actualOverlapX * 2;
            visH_mm = artworkHeight - actualOverlapY * 2;
        }

        const maxW = section.clientWidth || 400;
        const totalEdgeXp = (hasFrame ? frameWidthMm : 0) + (hasMount ? mountSizeMm : 0);
        const totalEdgeYp = totalEdgeXp;
        const totalWmm = artworkWidth + (totalEdgeXp - actualOverlapX) * 2;
        const totalHmm = artworkHeight + (totalEdgeYp - actualOverlapY) * 2;
        const sf = Math.min(maxW / totalWmm, 300 / totalHmm);

        previewCnv.width = Math.round(totalWmm * sf);
        previewCnv.height = Math.round(totalHmm * sf);
        const pctx = previewCnv.getContext('2d');
        pctx.clearRect(0, 0, previewCnv.width, previewCnv.height);

        const sFrame = frameWidthMm * sf;
        const sMount = mountSizeMm * sf;
        const sMountExtX = mountExtX * sf;
        const sMountExtY = mountExtY * sf;
        const sAW = artworkWidth * sf;
        const sAH = artworkHeight * sf;
        const outerX = 0, outerY = 0;
        const outerW = previewCnv.width, outerH = previewCnv.height;

        const aX = outerX + sFrame + (hasMount ? sMount : 0) - actualOverlapX * sf;
        const aY = outerY + sFrame + (hasMount ? sMount : 0) - actualOverlapY * sf;
        const mountX = outerX + sFrame;
        const mountY = outerY + sFrame;
        const innerX = mountX + (hasMount ? sMount : 0);
        const innerY = mountY + (hasMount ? sMount : 0);
        const sVisW = visW_mm * sf;
        const sVisH = visH_mm * sf;

        pctx.fillStyle = '#808080';
        pctx.fillRect(aX, aY, sAW, sAH);

        if (upImg) {
            const scl = getImgScale(upImg, artworkWidth, artworkHeight);
            const sW = upImg.width * scl, sH = upImg.height * scl;
            const ix = aX + ((artworkWidth - sW) / 2 + imgXOffset) * sf;
            const iy = aY + imgYOffset * sf;
            pctx.save();
            pctx.beginPath(); pctx.rect(aX, aY, sAW, sAH); pctx.clip();
            pctx.drawImage(upImg, ix, iy, sW * sf, sH * sf);
            pctx.restore();
        }

        if (hasMount && !mountOutside) {
            const mountColour = document.getElementById('mountColour').value;
            const mc = mountColour === 'white' ? '#f5f5f5' : mountColour === 'black' ? '#111' : mountColour;
            pctx.fillStyle = mc;
            pctx.fillRect(mountX, mountY, outerW - sFrame * 2, sMount);
            pctx.fillRect(mountX, mountY + outerH - sFrame * 2 - sMount, outerW - sFrame * 2, sMount);
            pctx.fillRect(mountX, mountY, sMount, outerH - sFrame * 2);
            pctx.fillRect(mountX + outerW - sFrame * 2 - sMount, mountY, sMount, outerH - sFrame * 2);
            const bSize = Math.min(6 * sf, sMount);
            pctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            pctx.beginPath(); pctx.moveTo(innerX, innerY); pctx.lineTo(innerX + sVisW, innerY); pctx.lineTo(innerX + sVisW + bSize, innerY - bSize); pctx.lineTo(innerX - bSize, innerY - bSize); pctx.fill();
            pctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            pctx.beginPath(); pctx.moveTo(innerX, innerY + sVisH); pctx.lineTo(innerX + sVisW, innerY + sVisH); pctx.lineTo(innerX + sVisW + bSize, innerY + sVisH + bSize); pctx.lineTo(innerX - bSize, innerY + sVisH + bSize); pctx.fill();
            pctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            pctx.beginPath(); pctx.moveTo(innerX, innerY); pctx.lineTo(innerX, innerY + sVisH); pctx.lineTo(innerX - bSize, innerY + sVisH + bSize); pctx.lineTo(innerX - bSize, innerY - bSize); pctx.fill();
            pctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            pctx.beginPath(); pctx.moveTo(innerX + sVisW, innerY); pctx.lineTo(innerX + sVisW, innerY + sVisH); pctx.lineTo(innerX + sVisW + bSize, innerY + sVisH + bSize); pctx.lineTo(innerX + sVisW + bSize, innerY - bSize); pctx.fill();
            pctx.strokeStyle = 'rgba(0, 0, 0, 0.3)'; pctx.lineWidth = 1; pctx.strokeRect(innerX, innerY, sVisW, sVisH);
            pctx.strokeStyle = 'rgba(0, 0, 0, 0.1)'; pctx.strokeRect(innerX - bSize, innerY - bSize, sVisW + bSize * 2, sVisH + bSize * 2);
        }

        if (hasFrame) {
            const fX = mountOutside ? sMountExtX : outerX;
            const fY = mountOutside ? sMountExtY : outerY;
            const fW = outerW - (mountOutside ? sMountExtX * 2 : 0);
            const fH = outerH - (mountOutside ? sMountExtY * 2 : 0);
            if (SOLID_FRAMES[selectedFrame]) {
                const x = fX, y = fY, w = fW, h = fH, ft = sFrame;
                pctx.fillStyle = SOLID_FRAMES[selectedFrame];
                pctx.beginPath(); pctx.moveTo(x, y); pctx.lineTo(x + w, y); pctx.lineTo(x + w - ft, y + ft); pctx.lineTo(x + ft, y + ft); pctx.closePath(); pctx.fill();
                pctx.beginPath(); pctx.moveTo(x, y + h); pctx.lineTo(x + w, y + h); pctx.lineTo(x + w - ft, y + h - ft); pctx.lineTo(x + ft, y + h - ft); pctx.closePath(); pctx.fill();
                pctx.beginPath(); pctx.moveTo(x, y); pctx.lineTo(x + ft, y + ft); pctx.lineTo(x + ft, y + h - ft); pctx.lineTo(x, y + h); pctx.closePath(); pctx.fill();
                pctx.beginPath(); pctx.moveTo(x + w, y); pctx.lineTo(x + w - ft, y + ft); pctx.lineTo(x + w - ft, y + h - ft); pctx.lineTo(x + w, y + h); pctx.closePath(); pctx.fill();
                pctx.strokeStyle = '#888888'; pctx.lineWidth = 1;
                pctx.beginPath();
                pctx.moveTo(x, y); pctx.lineTo(x + ft, y + ft);
                pctx.moveTo(x + w, y); pctx.lineTo(x + w - ft, y + ft);
                pctx.moveTo(x, y + h); pctx.lineTo(x + ft, y + h - ft);
                pctx.moveTo(x + w, y + h); pctx.lineTo(x + w - ft, y + h - ft);
                pctx.stroke();
                pctx.strokeRect(x, y, w, h);
                pctx.strokeRect(x + ft, y + ft, w - ft * 2, h - ft * 2);
            } else {
                try {
                    const frameImg = frameImageCache[selectedFrame] || await loadFrameImage(selectedFrame);
                    drawFrameAroundRect(pctx, frameImg, frameWidthMm, sf, fX, fY, fW, fH, selectedFrame);
                } catch(e) {}
            }
        }

        if (hasMount && mountOutside) {
            const mountColour = document.getElementById('mountColour').value;
            const mc = mountColour === 'white' ? '#f5f5f5' : mountColour === 'black' ? '#111' : mountColour;
            pctx.fillStyle = mc;
            pctx.fillRect(0, 0, outerW, sMountExtY);
            pctx.fillRect(0, outerH - sMountExtY, outerW, sMountExtY);
            pctx.fillRect(0, 0, sMountExtX, outerH);
            pctx.fillRect(outerW - sMountExtX, 0, sMountExtX, outerH);
        }
    }

    window.addEventListener('resize', () => { drawCnv(); updateLayout(); });
    document.getElementById('jpgBtn').addEventListener('click', exportLowResJPG);
    document.getElementById('pdfBtn').addEventListener('click', genPDF);
    document.getElementById('imgLdr').addEventListener('change', handleImgUp);
    document.getElementById('upBtn').addEventListener('click', () => document.getElementById('imgLdr').click());
    document.getElementById('rmvBtn').addEventListener('click', rmvImg);

    document.getElementById('fetchUrlBtn').addEventListener('click', async () => {
        const urlInput = document.getElementById('imgUrl');
        const statusEl = document.getElementById('urlStatus');
        const loader = document.getElementById('loader');
        const raw = urlInput.value.trim();
        if (!raw) return;
        statusEl.style.display = 'block';
        statusEl.style.color = '#888';
        statusEl.textContent = 'Fetching page...';
        try {
            const proxyUrl = 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(raw);
            const res = await fetch(proxyUrl, { headers: { 'Accept': 'text/html' } });
            if (!res.ok) throw new Error('Page fetch failed (' + res.status + ')');
            const html = await res.text();
            const canvasM = html.match(/class="canvas"[\s\S]{0,400}<img[^>]+src="([^"]+)"/);
            let imgSrc = canvasM ? canvasM[1].trim() : null;
            if (!imgSrc) {
                const m = html.match(/src="(https?:\/\/cdn\.felixr\.com\/photos\/[^"]+)"/);
                if (m) imgSrc = m[1];
            }
            if (!imgSrc) throw new Error('No artwork image found on page');
            imgSrc = imgSrc.replace(/\/photos\/[^/]+\//, '/photos/500/');
            statusEl.textContent = 'Loading image...';
            loader.style.display = 'block';
            const proxiedImg = 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(imgSrc);
            const newImg = new Image();
            newImg.crossOrigin = 'anonymous';
            newImg.onload = () => {
                upImg = newImg;
                imgXOffset = 0; imgYOffset = 0; imgZoomOffset = 0;
                loader.style.display = 'none';
                statusEl.style.color = '#27ae60';
                statusEl.textContent = 'Image loaded successfully';
                updateDpiNote(); drawCnv(); updateFramePreview();
            };
            newImg.onerror = () => {
                loader.style.display = 'none';
                statusEl.style.color = '#c00';
                statusEl.textContent = 'Could not load image';
            };
            newImg.src = proxiedImg;
        } catch (err) {
            loader.style.display = 'none';
            statusEl.style.color = '#c00';
            statusEl.textContent = err.message || 'Failed to fetch image';
        }
    });

    document.getElementById('imgUrl').addEventListener('input', () => {
        if (!document.getElementById('imgUrl').value.trim()) {
            document.getElementById('urlStatus').style.display = 'none';
        }
    });

    function setValues(cW, cH, fH1, fH2, fH3) {
        ['cW', 'cH', 'fH1', 'fH2', 'fH3'].forEach((id, i) => document.getElementById(id).value = [cW, cH, fH1, fH2, fH3][i]);
        document.getElementById('targetW').value = '';
        document.getElementById('targetH').value = '';
        drawCnv();
    }

    document.getElementById('ra5Btn').addEventListener('click', () => { setValues(1296, 1825, 12, 44, 776); drawExtraLine = false; activeTemplate = 'RA5'; drawCnv(); updateFramePreview(); updateDpiNote(); });
    document.getElementById('ra6Btn').addEventListener('click', () => { setValues(1516, 2100, 12, 37, 920); drawExtraLine = false; activeTemplate = 'RA6'; drawCnv(); updateFramePreview(); updateDpiNote(); });
    document.getElementById('ra7aBtn').addEventListener('click', () => { setValues(1786, 1206, 12, 46.5, 1057); drawExtraLine = true; activeTemplate = 'RA7'; drawCnv(); updateFramePreview(); updateDpiNote(); });
    document.getElementById('ra7bBtn').addEventListener('click', () => { setValues(1786, 1206, 12, 0, 0); drawExtraLine = false; activeTemplate = 'RA7B'; drawCnv(); updateFramePreview(); updateDpiNote(); });

    updateLayout();
    drawCnv();
    updateDpiNote();
    discoverFrames().then(() => updateFramePreview());
});
</script>
</body>
</html>
